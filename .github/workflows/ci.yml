name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test the console script
        run: |
          cron-postmortem --version
          set +e
          cron-postmortem scan \
            --crontab tests/fixtures/etc/crontab \
            --systemctl-show tests/fixtures/systemctl-show.txt \
            --log-file tests/fixtures/syslog-cron.log \
            --log-file tests/fixtures/journal-systemd.log \
            --now 2026-09-18T12:00:00 \
            --format json > /dev/null
          status=$?
          set -e
          # The fixtures contain problems, so the monitoring exit code must be 1.
          test "$status" -eq 1
